name: Deploy landing page to GitHub Pages

on:
  push:
    branches:
      - main
  # Kiểm tra build trên nhánh phát triển mà không deploy.
  pull_request:
  # Cho phép deploy thủ công từ tab Actions, chọn nhánh nào cũng được.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # GitHub sinh index.html + sitemap.xml từ content/site.mjs.
      # Bản commit trong repo chỉ để xem trước, luôn bị ghi đè ở đây,
      # nên nội dung deploy không bao giờ cũ so với content/site.mjs.
      - name: Build static site
        run: npm run build

      - name: Check build output
        run: |
          test -s index.html || { echo "index.html rỗng hoặc không tồn tại"; exit 1; }
          test -s en/index.html || { echo "en/index.html rỗng hoặc không tồn tại"; exit 1; }
          test -s sitemap.xml || { echo "sitemap.xml rỗng hoặc không tồn tại"; exit 1; }
          grep -q "</html>" index.html || { echo "index.html không đóng thẻ html"; exit 1; }
          echo "OK — $(wc -c < index.html) bytes"

      # Chỉ đóng gói phần công khai — docs/, tasks/, personal/ ở lại repo.
      - name: Stage public files
        run: |
          mkdir -p _site
          cp -r index.html sitemap.xml robots.txt CNAME .nojekyll assets en _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # Pull request chỉ build để kiểm tra, không đụng tới site đang chạy.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
