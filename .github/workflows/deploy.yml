name: Deploy landing page to GitHub Pages

on:
  push:
    branches:
      - main
  # Kiểm tra build trên nhánh phát triển mà không deploy.
  pull_request:
  # Cho phép deploy thủ công từ tab Actions, chọn nhánh nào cũng được.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm run build chạy check-content.mjs trước: hai bản ngôn ngữ lệch cấu
      # trúc là hỏng build ngay, không để lọt ra bản deploy.
      # Các file HTML commit trong repo chỉ để xem trước, luôn bị ghi đè ở đây,
      # nên bản deploy không bao giờ cũ so với content/.
      - name: Build static site
        run: npm run build

      - name: Check build output
        run: |
          for f in index.html en/index.html echelon/index.html en/echelon/index.html 404.html sitemap.xml assets/css/fonts.css; do
            test -s "$f" || { echo "$f rỗng hoặc không tồn tại"; exit 1; }
          done
          for f in index.html en/index.html echelon/index.html en/echelon/index.html 404.html; do
            grep -q "</html>" "$f" || { echo "$f không đóng thẻ html"; exit 1; }
          done
          echo "OK — vi $(wc -c < index.html) bytes, en $(wc -c < en/index.html) bytes"

      # Chỉ đóng gói phần công khai — docs/, tasks/, personal/ ở lại repo.
      - name: Stage public files
        run: |
          mkdir -p _site
          cp -r index.html 404.html sitemap.xml robots.txt CNAME .nojekyll assets en echelon _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # Pull request chỉ build để kiểm tra, không đụng tới site đang chạy.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
