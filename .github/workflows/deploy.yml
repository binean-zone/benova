name: Deploy landing page to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Sinh lại index.html + sitemap.xml từ content/site.mjs.
      - name: Build static site
        run: npm run build

      - name: Fail if generated files are stale
        run: |
          if ! git diff --quiet -- index.html sitemap.xml; then
            echo "index.html/sitemap.xml khác với kết quả build từ content/site.mjs."
            echo "Chạy 'npm run build' rồi commit lại."
            git --no-pager diff --stat -- index.html sitemap.xml
            exit 1
          fi

      # Chỉ đóng gói phần công khai — docs/, tasks/, personal/ ở lại repo.
      - name: Stage public files
        run: |
          mkdir -p _site
          cp -r index.html sitemap.xml robots.txt CNAME .nojekyll assets _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
